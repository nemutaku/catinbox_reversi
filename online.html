<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はこ×ねこリバーシ - オンラインロビー</title>
  <link rel="stylesheet" href="style.css?v=20260725-review-fixes-1">
</head>
<body>
<main class="online-screen">
  <h1 class="title-logo">ONLINE</h1>
  <p class="sub">友人とのオンライン対局を準備します。</p>

  <section class="online-panel" aria-label="オンライン対局">
    <div class="online-actions">
      <label class="room-join">
        <span>ニックネーム</span>
        <input id="nickname" type="text" maxlength="12" placeholder="ねこさん" autocomplete="nickname">
      </label>
      <button id="createRoom" type="button">部屋を作る</button>
      <label class="room-join">
        <span>部屋IDで参加</span>
        <input id="joinCode" type="text" inputmode="latin" maxlength="6" placeholder="ABC123" autocomplete="off">
      </label>
      <button id="joinRoom" type="button" class="secondary">参加する</button>
    </div>

    <div class="room-info" aria-live="polite">
      <span>現在の部屋ID</span>
      <strong id="roomCode">------</strong>
    </div>

    <button id="resumeRoom" type="button" class="secondary" hidden>前回の対局に戻る</button>

    <section id="matchPreview" class="match-preview" aria-live="polite" hidden>
      <p class="match-preview-title">マッチングしました</p>
      <div class="match-preview-players">
        <div class="match-preview-player black">
          <span>黒</span>
          <em id="matchBlackTitle" class="player-title-badge">新米ねこ</em>
          <strong id="matchBlackName">--</strong>
        </div>
        <div class="match-preview-player white">
          <span>白</span>
          <em id="matchWhiteTitle" class="player-title-badge">新米ねこ</em>
          <strong id="matchWhiteName">--</strong>
        </div>
      </div>
      <p id="matchYourTurn" class="match-preview-note">あなたは--です。</p>
    </section>

    <p id="onlineStatus" class="online-status">オンラインに接続しています...</p>
  </section>

  <div class="options-actions">
    <button id="modeSelectButton" type="button" class="secondary">モード選択へ戻る</button>
  </div>
</main>

<script>
  window.showOnlineScriptError = function (label) {
    const status = document.querySelector('#onlineStatus');
    if (!status) return;
    status.textContent = 'オンライン機能の読み込みに失敗しました。通信環境を確認して、もう一度お試しください。';
    status.classList.add('error');
  };
</script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js" onerror="showOnlineScriptError('Firebase app SDK')"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js" onerror="showOnlineScriptError('Firebase auth SDK')"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js" onerror="showOnlineScriptError('Firebase firestore SDK')"></script>
<script src="js/audio.js"></script>
<script src="js/firebase-config.js?v=20260715-1"></script>
<script src="js/online.js?v=20260725-player-titles-1"></script>
</body>
</html>
