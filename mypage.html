<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はこ×ねこリバーシ - マイページ</title>
  <link rel="stylesheet" href="style.css?v=20260901-title-toggle-close-1">
</head>
<body>
<main class="mypage-screen">
  <h1 class="title-logo">マイページ</h1>
  <p class="sub">名前や称号、これまでのオンライン対局を確認できます。</p>

  <section class="mypage-panel" aria-label="マイデータ">
    <div class="mypage-field">
      <span>称号</span>
      <strong id="currentTitleDisplay" class="current-title-display">新米ねこ</strong>
    </div>
    <button id="openTitleList" class="action" type="button">称号一覧</button>

    <label class="mypage-field">
      <span>ニックネーム</span>
      <input id="profileName" type="text" maxlength="12" placeholder="ねこさん" autocomplete="nickname">
    </label>
    <button id="saveProfileName" class="action" type="button">名前を保存</button>
    <p id="profileNameStatus" class="mypage-status" aria-live="polite"></p>

    <span class="mypage-section-label">マイデータ</span>
    <button id="openMyData" class="action" type="button">マイデータ</button>
  </section>

  <section class="mypage-panel" aria-label="棋譜の確認">
    <h2 class="panel-title">棋譜の確認</h2>
    <p class="mypage-note">終局したオンライン対局を種類ごとに新しい順で最大20件まで表示します。</p>
    <div class="match-history-tabs" role="tablist" aria-label="棋譜の種類">
      <button id="randomHistoryTab" class="history-tab active" type="button" role="tab" aria-selected="true" data-match-filter="random">ランダム戦</button>
      <button id="friendHistoryTab" class="history-tab" type="button" role="tab" aria-selected="false" data-match-filter="friend">友人戦</button>
    </div>
    <div id="matchHistoryList" class="match-history-list" aria-live="polite"></div>
  </section>

  <div class="options-actions">
    <button id="modeSelectButton" class="action secondary" type="button">戻る</button>
  </div>
</main>

<script src="js/audio.js?v=20260829-file-audio-fallback-1"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=20260715-1"></script>
<script src="js/profile.js?v=20260831-title-comment-1"></script>
<script src="js/mypage.js?v=20260830-mydata-page-1"></script>
</body>
</html>
