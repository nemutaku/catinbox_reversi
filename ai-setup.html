<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はこ×ねこリバーシ - あいて設定</title>
  <script>
    if (sessionStorage.getItem('othelloPageTransition') === '1') {
      document.documentElement.classList.add('page-entering');
      sessionStorage.removeItem('othelloPageTransition');
    }
  </script>
  <link rel="stylesheet" href="style.css?v=20260819-cache-review-1">
</head>
<body>
<main class="ai-setup-screen">
  <div>
    <h1 class="title-logo">&#12354;&#12356;&#12390;&#23550;&#23616;</h1>
    <p class="sub">&#25163;&#30058;&#12392;&#12354;&#12356;&#12390;&#12398;&#24375;&#12373;&#12434;&#36984;&#12435;&#12391;&#12367;&#12384;&#12373;&#12356;</p>
  </div>

  <section class="ai-setup-panel" aria-label="&#12354;&#12356;&#12390;&#23550;&#23616;&#35373;&#23450;">
    <div class="ai-setup-group">
      <h2 class="panel-title">&#33258;&#20998;&#12398;&#33394;</h2>
      <div class="player-color-options ai-setup-options">
        <label class="stone-choice"><input type="radio" name="playerColor" value="black" checked><span class="dot black"></span>&#40658;</label>
        <label class="stone-choice"><input type="radio" name="playerColor" value="white"><span class="dot white"></span>&#30333;</label>
      </div>
    </div>

    <div class="ai-setup-group">
      <h2 class="panel-title">&#12354;&#12356;&#12390;&#12398;&#24375;&#12373;</h2>
      <div class="ai-difficulty-options ai-setup-options">
        <label class="difficulty-choice"><input type="radio" name="aiDifficulty" value="easy" checked>&#12363;&#12435;&#12383;&#12435;</label>
        <label class="difficulty-choice"><input type="radio" name="aiDifficulty" value="normal">&#12405;&#12388;&#12358;</label>
        <label class="difficulty-choice"><input type="radio" name="aiDifficulty" value="hard">&#12416;&#12378;&#12363;&#12375;&#12356;</label>
      </div>
    </div>

    <section class="custom-match-box" aria-label="カスタムマッチ設定">
      <label class="custom-match-toggle">
        <input id="aiCustomMatchEnabled" type="checkbox">
        <span>カスタムマッチ</span>
      </label>
      <div id="aiCustomMatchSettings" class="custom-match-settings" hidden>
        <label class="custom-match-field">
          <span>通常はこ：同色ねこ出現率(%)</span>
          <input id="aiCustomNormalProbability" type="number" min="0" max="100" step="1" value="80">
        </label>
        <label class="custom-match-field">
          <span>特殊はこ(1)：同色ねこ出現率(%)</span>
          <input id="aiCustomSpecial0Probability" type="number" min="0" max="100" step="1" value="0">
        </label>
        <label class="custom-match-field">
          <span>特殊はこ(1)使用回数(回)</span>
          <input id="aiCustomSpecial0Uses" type="number" min="0" max="50" step="1" value="2">
        </label>
        <label class="custom-match-field">
          <span>特殊はこ(2)：同色ねこ出現率(%)</span>
          <input id="aiCustomSpecial100Probability" type="number" min="0" max="100" step="1" value="100">
        </label>
        <label class="custom-match-field">
          <span>特殊はこ(2)使用回数(回)</span>
          <input id="aiCustomSpecial100Uses" type="number" min="0" max="50" step="1" value="2">
        </label>
        <label class="custom-match-field">
          <span>オープン！使用回数(回)</span>
          <input id="aiCustomObserveUses" type="number" min="0" max="50" step="1" value="2">
        </label>
        <label class="custom-match-field custom-initial-launch">
          <span>初期盤面</span>
          <button id="aiCustomInitialSetupButton" type="button" class="action secondary">初期盤面</button>
        </label>
        <button id="aiCustomMatchReset" type="button" class="action secondary custom-match-reset">リセット</button>
      </div>
    </section>
  </section>

  <div class="ai-setup-actions">
    <button id="startAiBattle" type="button" class="action">&#23550;&#23616;&#38283;&#22987;</button>
    <button id="modeSelectButton" type="button" class="action secondary">&#12514;&#12540;&#12489;&#36984;&#25246;&#12408;&#25147;&#12427;</button>
  </div>
</main>

<script src="js/audio.js?v=20260726-webaudio-1"></script>
<script src="js/custom-match-settings.js?v=20260819-cache-review-1"></script>
<script>
(() => {
  const playerColorKey = 'othelloAiPlayerColor';
  const difficultyKey = 'othelloAiDifficulty';
  const clickAudio = window.OthelloAudio?.createMatchAudioController?.();
  const custom = window.OthelloCustomSettings;
  const customEnabled = document.querySelector('#aiCustomMatchEnabled');
  const customSettings = document.querySelector('#aiCustomMatchSettings');
  const customFields = {
    normalProbability: document.querySelector('#aiCustomNormalProbability'),
    special0Probability: document.querySelector('#aiCustomSpecial0Probability'),
    special0Uses: document.querySelector('#aiCustomSpecial0Uses'),
    special100Probability: document.querySelector('#aiCustomSpecial100Probability'),
    special100Uses: document.querySelector('#aiCustomSpecial100Uses'),
    observeUses: document.querySelector('#aiCustomObserveUses')
  };

  function playClickSound() {
    clickAudio?.playSound?.(window.OthelloAudio.sounds.uiClick, 0.55);
  }

  function transitionTo(path) {
    playClickSound();
    if (window.parent && window.parent !== window && sessionStorage.getItem('othelloShellAudio') === '1') {
      window.parent.postMessage({ type: 'othello:navigate', path, click: false }, '*');
      return;
    }
    location.href = path;
  }

  function loadPlayerColor() {
    return localStorage.getItem(playerColorKey) === 'white' ? 'white' : 'black';
  }

  function loadDifficulty() {
    const value = localStorage.getItem(difficultyKey);
    return ['easy', 'normal', 'hard'].includes(value) ? value : 'easy';
  }

  function syncRadioGroup(name, value) {
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.checked = input.value === value;
    });
  }

  function selectedValue(name) {
    return document.querySelector(`input[name="${name}"]:checked`)?.value;
  }

  syncRadioGroup('playerColor', loadPlayerColor());
  syncRadioGroup('aiDifficulty', loadDifficulty());

  function updateCustomVisibility() {
    if (customSettings) customSettings.hidden = !customEnabled?.checked;
  }

  custom?.restoreDraft?.('ai', customEnabled, customFields);
  custom?.bindNumberClipping?.(customFields);
  updateCustomVisibility();

  Object.values(customFields).forEach(input => {
    input?.addEventListener('change', () => custom?.saveDraft?.('ai', customEnabled?.checked, customFields));
  });

  customEnabled?.addEventListener('change', () => {
    updateCustomVisibility();
    custom?.saveDraft?.('ai', customEnabled.checked, customFields);
  });

  document.querySelector('#aiCustomInitialSetupButton')?.addEventListener('click', () => {
    custom?.prepareInitialBoard?.('ai-setup.html', customFields);
    transitionTo('initial-board.html?from=ai');
  });

  document.querySelector('#aiCustomMatchReset')?.addEventListener('click', () => {
    playClickSound();
    custom?.setDefaultForm?.(customFields);
    custom?.saveDraft?.('ai', customEnabled?.checked, customFields);
  });

  document.querySelector('#startAiBattle').addEventListener('click', () => {
    localStorage.setItem(playerColorKey, selectedValue('playerColor') || 'black');
    localStorage.setItem(difficultyKey, selectedValue('aiDifficulty') || 'easy');
    custom?.saveDraft?.('ai', customEnabled?.checked, customFields);
    transitionTo('othello-ai.html');
  });

  document.querySelector('#modeSelectButton').addEventListener('click', () => transitionTo('mode-select.html'));
})();
</script>
</body>
</html>
