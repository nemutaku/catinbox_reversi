<!doctype html>
<html lang="ja">
<head>

</head>
<body>
<main class="mypage-screen">
  <h1 class="title-logo">称号一覧</h1>
  <p class="sub">獲得した称号を選んでセットできます。</p>

  <section class="mypage-panel" aria-label="称号一覧">
    <div class="title-list-tabs" role="tablist" aria-label="称号の種類">
      <button class="history-tab active" type="button" role="tab" aria-selected="true" data-title-filter="normal">ノーマル称号</button>
      <button class="history-tab" type="button" role="tab" aria-selected="false" data-title-filter="special">スペシャル称号</button>
    </div>
    <div id="titleList" class="title-list" aria-live="polite"></div>
  </section>

  <div class="options-actions">
    <button id="mypageButton" class="action secondary" type="button">マイページに戻る</button>
  </div>
</main>
